<style>
  :root{--ink:#1B2A33;--ink-2:#5C6F78;--ink-3:#8FA0A7;--paper:#ECEFEA;--card:#FFFFFF;
    --line:#DCE1DC;--line-2:#EDF0EC;--jade:#0E6B5C;--amber:#C8792B;--brick:#9C4A3C;--r:10px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:0 18px 108px;min-height:100vh}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px}

  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px;gap:8px}
  .month{display:flex;align-items:center;gap:2px}
  .month h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;min-width:118px;text-align:center}
  .arrow{background:none;border:0;width:34px;height:34px;font-size:19px;color:var(--ink-2);line-height:1;border-radius:50%}
  .arrow[disabled]{opacity:.25}
  .gear{background:none;border:0;width:36px;height:36px;border-radius:50%;color:var(--ink-2);font-size:17px}

  .hero{padding:16px 0 4px}
  .hero .lead{font-size:14px;color:var(--ink-2)}
  .hero .sum{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:2px 0 0}
  .hero .sum small{font-size:20px;font-weight:500;letter-spacing:0;margin-left:2px;color:var(--ink-2)}
  .hero .sub{font-size:13.5px;color:var(--ink-2);margin-top:7px}
  .hero .sub b{font-weight:600;color:var(--ink)}
  .stack{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:18px 0 6px;background:#DFE4DE}
  .stack i{display:block;height:100%}
  .stack-note{font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px}

  h2{font-size:13.5px;font-weight:600;color:var(--ink-2);margin:30px 0 10px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

  .cat{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line-2);background:var(--card);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
  .cat:last-child{border-bottom:0}
  .spine{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:22px}
  .cat-body{flex:1;min-width:0}
  .cat-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .cat-name{font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-amt{font-weight:600;font-size:14.5px;white-space:nowrap}
  .caret{color:var(--ink-3);font-size:11px;margin-left:5px}
  .track{display:block;position:relative;height:3px;background:var(--line-2);border-radius:2px;margin-top:8px}
  .track i{display:block;height:100%;border-radius:2px}
  .track u{position:absolute;top:-2px;width:2px;height:calc(100% + 4px);background:var(--ink-3);text-decoration:none}
  .pace{position:relative;height:9px;background:#DFE4DE;border-radius:5px;overflow:visible;margin:9px 0 7px}
  .pace i{display:block;height:100%;border-radius:5px}
  .pace u{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);text-decoration:none}
  .tick-legend{display:inline-block;width:2px;height:11px;background:var(--ink-3);vertical-align:-1px;margin-right:5px}
  .cat-meta{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
  .over{color:var(--amber);font-weight:500}
  .sub{display:flex;justify-content:space-between;gap:10px;padding:9px 14px 9px 42px;background:#F7F9F6;border-bottom:1px solid var(--line-2);font-size:13.5px}
  .sub span:first-child{color:var(--ink-2)}
  .sub b{font-weight:600}
  .sub em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:7px}

  .src{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-2)}
  .src:last-child{border-bottom:0}
  .src-n{font-size:14.5px;font-weight:500}
  .src-m{font-size:12px;color:var(--ink-3);margin-top:3px}
  .src-a{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}
  .src-a.neg{color:var(--brick)}
  .lech{color:var(--amber);font-weight:500}
  .khop{color:var(--jade)}
  .chk-btn{background:none;border:0;color:var(--jade);font-size:12px;font-weight:600;padding:4px 0 0;text-decoration:underline}

  .days{display:flex;align-items:flex-end;gap:2px;height:64px;padding:12px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0}
  .days i{flex:1;background:var(--jade);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .days i.today{background:var(--amber);opacity:1}
  .days-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);padding:6px 12px 11px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}

  .tx{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start}
  .tx:last-child{border-bottom:0}
  .tx-body{flex:1;min-width:0}
  .tx-n{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-m{font-size:12px;color:var(--ink-3);margin-top:3px}
  .tx-a{font-weight:600;font-size:14.5px;white-space:nowrap;text-align:right}
  .tx-a.in{color:var(--jade)}
  .tx-a.mv{color:var(--ink-3)}
  .daygroup{font-size:12.5px;color:var(--ink-2);font-weight:500;padding:11px 14px 7px;background:#F7F9F6;border-bottom:1px solid var(--line-2)}

  .btn{display:block;width:100%;padding:14px;border-radius:var(--r);border:0;background:var(--jade);color:#fff;font-weight:600;font-size:15px;text-align:center}
  .btn[disabled]{background:#A7B8B3}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.danger{background:var(--card);color:var(--brick);border:1px solid var(--line);font-weight:500}

  textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);resize:vertical;line-height:1.45;font-size:13.5px}
  .mono{font-size:12.5px;line-height:1.5;color:var(--ink-2);background:#F7F9F6}

  .rev{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:11px;align-items:flex-start}
  .rev:last-child{border-bottom:0}
  .rev.off{opacity:.42}
  .chk{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid #C3CCC4;background:var(--card);margin-top:2px;display:grid;place-items:center;color:#fff;font-size:13px;padding:0}
  .chk.on{background:var(--jade);border-color:var(--jade)}
  .pill{font-size:12.5px;padding:6px 9px;border-radius:8px;background:#F1F4F0;border:1px solid var(--line);margin-top:7px;max-width:100%;font-weight:500}
  .pill.need{border-color:var(--amber);background:#FBF0E6;color:#8A5418}
  .dup{font-size:11.5px;color:var(--amber);font-weight:500;margin-top:5px}
  .rename{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#FAFBF9;font-size:14px}
  .hint{font-size:12px;color:var(--amber);margin-top:6px;font-weight:500}
  .tag{display:inline-block;font-size:11.5px;color:var(--ink-3);margin-top:6px}

  .bars{display:flex;align-items:flex-end;gap:9px;height:132px;padding:0 4px}
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .bcol i{width:100%;background:var(--jade);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
  .bcol i.cur{background:var(--amber);opacity:1}
  .bcol span{font-size:11.5px;color:var(--ink-3);margin-top:7px}
  .bcol em{font-size:11px;color:var(--ink-2);font-style:normal;margin-bottom:5px;font-weight:500}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .row:last-child{border-bottom:0}
  .row label{font-size:14.5px;display:flex;align-items:center;gap:9px;min-width:0}
  .row input{width:118px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#FAFBF9}
  .fld{padding:12px 14px;border-bottom:1px solid var(--line-2)}

 {id:'muon',sn:'Cho mượn', k:'chi',n:'Cho mượn', c:'#8C7B4A', subs:[]},

 {id:'luong', k:'thu', n:'Lương', c:'#0E6B5C', subs:[]},
 {id:'thuong',sn:'Thưởng', k:'thu', n:'Thưởng', c:'#4E8C5A', subs:[['thuong_tet','Thưởng lễ Tết'],['thuong_hq','Thưởng hiệu quả']]},

];
const SRC=[{id:'bidv',n:'BIDV'},{id:'vi',n:'Ví điện tử'},{id:'tm',n:'Tiền mặt'}];
const srcOf=id=>SRC.find(s=>s.id===id)||SRC[0];
const NOGROUP={id:'',n:'Chưa chọn nhóm',c:'#C3CCC4',subs:[],k:'chi'};
function groupOf(code){
  if(!code)return NOGROUP;
  return GROUPS.find(g=>g.id===code||g.subs.some(s=>s[0]===code))||NOGROUP;
}
function labelOf(code){
  const g=groupOf(code); if(!code)return g.n;
  const s=g.subs.find(x=>x[0]===code);
  return s?s[1]:g.n;
}
const validCode=(code,kind)=>{const g=groupOf(code);return !!code&&g.id&&(!kind||g.k===kind);};

const KEY='sochi:data';
const VERSION='5.1';
let DB={txns:[],debts:[],budgets:{},rules:{},opens:{bidv:0,vi:0,tm:0},checks:{},opts:{ab:'off'},lastBackup:0,v:4};
let tab='home', cursor=new Date(), pending=null, msg='', msgType='err', open={};

/* ==================== tiện ích ==================== */
const money=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n));
const short=n=>{const g=n<0?'-':'';n=Math.abs(n);
  return g+(n>=1e9?(n/1e9).toFixed(n%1e9?1:0)+' tỷ':n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+' tr':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n)));};
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const iso=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const MONTH=m=>'Tháng '+(m+1);
const daysIn=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const noAccent=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function merchantKey(s){
  return noAccent(s).replace(/[^a-z0-9\s]/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim()
    .split(' ').filter(w=>w.length>1).slice(0,4).join(' ');
}
const fid=t=>t.d+'|'+t.a+'|'+(t.p||merchantKey(t.n0||t.n).slice(0,24));
function parseAmt(v){
  let s=noAccent(v).replace(/[\s₫+]/g,'').replace(/vnd|dong/g,'').replace(/d$/,'').replace(/^[-−–—]/,'');
  if(/^\d{1,3}(,\d{3})+/.test(s)) s=s.replace(/,/g,'');
  else if(/^\d{1,3}(\.\d{3})+/.test(s)) s=s.replace(/\./g,'');
  else s=s.replace(/,/g,'.');
  const m=s.match(/^(\d+(?:\.\d+)?)(tr|trieu|k|m)?(\d*)$/); if(!m)return NaN;
  let b=parseFloat(m[1]); if(isNaN(b))return NaN; const u=m[2];
  if(u==='tr'||u==='trieu'||u==='m'){b*=1e6; if(m[3])b+=parseFloat(m[3])*1e6/Math.pow(10,m[3].length);}
  else if(u==='k'){b*=1e3; if(m[3])b+=parseFloat(m[3])*1e3/Math.pow(10,m[3].length);}
  return Math.round(b);
}

/* ==================== lưu trữ ==================== */
const store={
  async get(){ if(window.storage){try{const r=await window.storage.get(KEY);return r&&r.value;}catch(e){}}
    try{return localStorage.getItem(KEY);}catch(e){return null;} },
  async set(v){ if(window.storage){try{await window.storage.set(KEY,v);return true;}catch(e){}}
    try{localStorage.setItem(KEY,v);return true;}catch(e){return false;} }
};
function migrate(d){
  const v=d.v||1;
  if(v<2)(d.txns||[]).forEach(t=>{
    if(!t.s)t.s='bidv';
    if(t.x){t.t='mv';t.s2=t.w?'vi':'tm';delete t.x;delete t.c;}
    else if(t.c==='ms')t.c='qa'; else if(t.c==='ck'||t.c==='kh')t.c='';
  });
  if(v<3){const M={vay:'muon',no:'thuno'};
    (d.txns||[]).forEach(t=>{if(t.c&&M[t.c])t.c=M[t.c];
      if(t.c&&!groupOf(t.c).id)t.c='';});
    const nb={}; Object.entries(d.budgets||{}).forEach(([k,v2])=>{nb[M[k]||k]=v2;}); d.budgets=nb;}
  if(v<4){ d.debts=d.debts||[]; }
  d.v=4; return d;
}
async function load(){try{const raw=await store.get();if(raw){let d=JSON.parse(raw);
  if((d.v||1)<4)d=migrate(d);
  DB=Object.assign({},d,{txns:Array.isArray(d.txns)?d.txns:[],debts:Array.isArray(d.debts)?d.debts:[],
    budgets:d.budgets||{},rules:d.rules||{},
    opens:Object.assign({bidv:0,vi:0,tm:0},d.opens||{}),checks:d.checks||{},
    opts:Object.assign({ab:'off'},d.opts||{}),lastBackup:d.lastBackup||0,v:4});}}catch(e){}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>store.set(JSON.stringify(DB)),200);}

/* ==================== sao lưu ==================== */
const backupName=()=>'so-chi-tieu-'+iso(new Date())+'.json';
const daysSinceBackup=()=>DB.lastBackup?Math.floor((Date.now()-DB.lastBackup)/864e5):null;
function backupFile(){const body=JSON.stringify(DB);
  try{return new File([body],backupName(),{type:'application/json'});}
  catch(e){return new Blob([body],{type:'application/json'});}}
function download(f){const url=URL.createObjectURL(f),a=document.createElement('a');
  a.href=url;a.download=f.name||backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);}
function runBackup(mode,quiet){
  const f=backupFile();
  const done=()=>{DB.lastBackup=Date.now();save();if(!quiet)flash('Đã tạo bản sao lưu.','ok');else render();};
  if(mode==='share'&&navigator.canShare&&navigator.share){
    try{if(navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'Sao lưu sổ chi tiêu'}).then(done)
        .catch(e=>{if(e&&e.name!=='AbortError'){try{download(f);done();}catch(_){}}});
      return;}}catch(e){}}
  try{download(f);done();}catch(e){if(!quiet)flash('Trình duyệt chặn tải file.','err');}
}
function autoBackup(){const m=(DB.opts&&DB.opts.ab)||'off';if(m!=='off')runBackup(m,true);}
function flash(t,k){msg=t;msgType=k||'err';render();}

/* ==================== số dư & đối chiếu ==================== */
function balances(){
  const b={bidv:+DB.opens.bidv||0, vi:+DB.opens.vi||0, tm:+DB.opens.tm||0};
  DB.txns.forEach(t=>{
    const s=t.s||'bidv';
    if(t.t==='mv'){ b[s]=(b[s]||0)-t.a; const to=t.s2||'tm'; b[to]=(b[to]||0)+t.a; }
    else if(t.t==='dc'){ b[s]=(b[s]||0)+(t.dir==='-'?-t.a:t.a); }
    else b[s]=(b[s]||0)+(t.t==='thu'?t.a:-t.a);
  });
  return b;
}
function reportedBidv(){
  const rows=DB.txns.filter(t=>t.b&&(t.s||'bidv')==='bidv')
    .sort((x,y)=>(x.d+' '+(x.tm||'00:00')).localeCompare(y.d+' '+(y.tm||'00:00')));
  return rows.length?rows[rows.length-1]:null;
}
function bidvCheck(){
  const rep=reportedBidv(); if(!rep)return null;
  const cut=rep.d+' '+(rep.tm||'00:00');
  let v=+DB.opens.bidv||0;
  DB.txns.forEach(t=>{
    if((t.d+' '+(t.tm||'00:00'))>cut)return;
    const s=t.s||'bidv';
    if(t.t==='mv'){ if(s==='bidv')v-=t.a; if(t.s2==='bidv')v+=t.a; }
    else if(s!=='bidv')return;
    else if(t.t==='dc')v+=(t.dir==='-'?-t.a:t.a);
    else v+=(t.t==='thu'?t.a:-t.a);
  });
  return {computed:v,reported:rep.b,diff:v-rep.b,at:rep};
}
function chainGaps(){
  const rows=DB.txns.filter(t=>t.b&&(t.s||'bidv')==='bidv')
    .sort((x,y)=>(x.d+' '+(x.tm||'00:00')).localeCompare(y.d+' '+(y.tm||'00:00')));
  const out=[];
  for(let i=1;i<rows.length;i++){
    const p=rows[i-1],c=rows[i];
    const expect=p.b+(c.t==='thu'?c.a:-c.a);
    if(Math.abs(expect-c.b)>=1) out.push({d:c.d,tm:c.tm,gap:c.b-expect});
  }
  return out;
}
/* ==================== khoản nợ ==================== */
const addMonths=(isoD,k)=>{const [y,m,dd]=isoD.split('-').map(Number);
  const t=new Date(y,m-1+k,1), last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(dd,last)).padStart(2,'0');};
const cleanName=s=>String(s).replace(/chuy[eể]?[nể]?\s*ti[eề]n/gi,'')
  .replace(/\s{2,}/g,' ').replace(/^[\s·,-]+|[\s·,-]+$/g,'').slice(0,40)||'Khoản nợ';
const paidOf=id=>DB.txns.filter(t=>t.debt===id).reduce((s,t)=>s+t.a,0);
function debtInfo(dt){
  const total=dt.mode==='gop'?(dt.periods||0)*(dt.per||0):(dt.principal||0);
  const paid=paidOf(dt.id), left=Math.max(0,total-paid);
  const lai=dt.mode==='gop'?Math.max(0,total-(dt.principal||0)):0;
  let nextDate='', nextAmt=0, kyDone=0;
  if(dt.mode==='gop'&&dt.per){
    kyDone=Math.min(dt.periods||0,Math.floor(paid/dt.per));
    if(left>0){nextDate=addMonths(dt.start||iso(new Date()),kyDone);nextAmt=Math.min(dt.per,left);}
  }else if(left>0){nextDate=dt.due||'';nextAmt=left;}
  const days=nextDate?Math.ceil((new Date(nextDate+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5):null;
  return {total,paid,left,lai,nextDate,nextAmt,kyDone,days,done:left<=0};
}
const debtTotals=()=>{
  let no=0,cho=0;
  DB.debts.forEach(d=>{const i=debtInfo(d);if(d.kind==='cho')cho+=i.left;else no+=i.left;});
  return {no,cho};
};
function reconcile(sid){
  const bal=balances(), cur=bal[sid]||0;
  const raw=prompt(srcOf(sid).n+' — app tính '+money(cur)+' ₫.\nNếu khớp thì bấm OK. Nếu không, gõ số dư thật:', money(cur));
  if(raw===null)return;
  const n=parseAmt(raw);
  DB.checks=DB.checks||{};
  if(isNaN(n)||n===cur){ DB.checks[sid]=Date.now(); save(); flash('Đã ghi nhận '+srcOf(sid).n+' khớp.','ok'); return; }
  const diff=n-cur;
  DB.txns.push({id:Date.now()+Math.random(),d:iso(new Date()),t:'dc',s:sid,
    a:Math.abs(diff),dir:diff>0?'+':'-',n:'Điều chỉnh số dư '+srcOf(sid).n});
  DB.checks[sid]=Date.now(); save();
  flash('Đã ghi chênh lệch '+(diff>0?'+':'-')+money(Math.abs(diff))+' ₫. Nếu nhớ ra khoản nào thiếu, xóa dòng điều chỉnh rồi nhập lại cho đúng.','ok');
}

/* ==================== câu lệnh cho AI ==================== */
function codeList(kind){
  return GROUPS.filter(g=>g.k===kind).map(g=>
    g.subs.length? g.subs.map(s=>s[0]+'='+g.n+' › '+s[1]).join(', ')+', '+g.id+'='+g.n+' (chung)'
                 : g.id+'='+g.n).join(', ');
}
function promptText(){
  return `Tôi tên NGUYEN THI THAO VY. Mỗi ngày tôi gửi ảnh chụp màn hình chi tiết giao dịch, có thể từ app BIDV hoặc từ app ví điện tử (MoMo, ZaloPay). Với mỗi ảnh trả về đúng một dòng theo định dạng sau, không viết gì thêm:

YYYY-MM-DD HH:MM | nguồn | chi hoặc thu | số tiền | nội dung | mã nhóm | số dư | mã đối tác

Quy ước:
- nguồn: ghi "bidv" nếu ảnh từ app BIDV, ghi "vi" nếu ảnh từ ví điện tử.

- chi hay thu: số màu đỏ hoặc có dấu trừ là "chi"; màu xanh hoặc có dấu cộng là "thu".

- mã đối tác: số tài khoản của người nhận hoặc người gửi, hoặc số điện thoại nếu là nạp điện thoại. Không có thì để trống.
- Nếu là chuyển tiền từ BIDV vào ví điện tử (nội dung có CASHIN hoặc tên ví), ghi mã nhóm là napvi.
- Nếu chỉ có mã QR không rõ nơi bán: nội dung ghi "Thanh toán QR", mã nhóm để trống.
- Nếu không chắc chắn nhóm nào thì để trống mã nhóm, đừng đoán bừa.

Mã nhóm chi: ${codeList('chi')}
Mã nhóm thu: ${codeList('thu')}

Cách làm việc:

- Không chào hỏi, không giải thích, không hỏi lại.
- Nếu một ảnh mờ hoặc thiếu thông tin, thay dòng đó bằng: KHÔNG ĐỌC ĐƯỢC | lý do ngắn gọn. Tuyệt đối không đoán số.

Ví dụ:
2026-08-22 10:07 | vi | chi | 20000 | Nạp data Viettel | hd_dt |  | 0981980039
2026-09-02 14:23 | bidv | chi | 950000 | Chuyển tiền đi chơi Phước Hải | gt_dichoi | 235490 | 7170145678910`;
}
async function copyPrompt(){
  try{await navigator.clipboard.writeText(promptText());flash('Đã chép câu lệnh.','ok');}
  catch(e){flash('Trình duyệt chặn chép tự động, Vy chép tay trong ô nhé.','err');}

const isQR=t=>/(^|[^a-z])v?qr([^a-z]|$)|quet ma/.test(noAccent(t.n0||t.n));
const KW=[
 ['an_cafe', /ca phe|cafe|coffee|tra sua|tra chanh|tra dao|highlands|phuc long|katinat|milano|starbucks|the coffee/],

function guessCode(t){
  const s=noAccent(t.n0||t.n);
  for(const [code,re] of KW) if(re.test(s)) return code;
  return '';
}
/* Ăn uống trước 9 giờ sáng mặc định là Ăn sáng */
function refineByTime(code,tm){
  if(code==='an'&&tm&&tm<'09:00')return 'an_sang';
  return code;
}

function parsePaste(raw){
  const out=[]; let txt=String(raw).replace(/```[a-z]*|```/g,'').trim();
  const today=new Date();
  txt.split(/\r?\n/).forEach(line=>{
    let s=line.trim().replace(/^\|/,'').replace(/\|$/,'').trim();
    if(!s||!s.includes('|'))return;
    const p=s.split('|').map(x=>x.trim());
    if(p.length<4)return;
    if(/^[-: ]+$/.test(p[0]))return;
    if(/ngay|ngày|date/.test(noAccent(p[0]))&&/nguon|source/.test(noAccent(p[1]||'')))return;

    let d=null, dm=p[0].match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(dm) d=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');
    else{
      const dm2=p[0].match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/);
      if(!dm2)return;
      let y=dm2[3]?(dm2[3].length===2?'20'+dm2[3]:dm2[3]):String(today.getFullYear());
      if(!dm2[3]&&+dm2[2]>today.getMonth()+1)y=String(today.getFullYear()-1);
      d=y+'-'+dm2[2].padStart(2,'0')+'-'+dm2[1].padStart(2,'0');
    }
    const tmm=p[0].match(/(\d{1,2}):(\d{2})/);
    const tm=tmm?tmm[1].padStart(2,'0')+':'+tmm[2]:'';
    const sr=noAccent(p[1]||'bidv');
    const s0=sr.includes('vi')||sr.includes('momo')?'vi':sr.includes('mat')||sr==='tm'?'tm':'bidv';
    const kind=noAccent(p[2]||'chi');
    let t=(kind.includes('thu')||kind.includes('vao'))?'thu':'chi';
    const a=parseAmt(p[3]); if(!a||isNaN(a))return;
    const n=(p[4]||'Giao dịch').slice(0,60);
    let code=(p[5]||'').trim().toLowerCase();
    const b=p[6]?parseAmt(p[6]):NaN;
    const party=(p[7]||'').replace(/\D/g,'').slice(0,20);

    const row={d,tm,a,t,n,n0:n,s:s0,c:''};
    if(!isNaN(b)&&b)row.b=b;
    if(party)row.p=party;
    if(code==='napvi'){row.t='mv';row.s='bidv';row.s2='vi';row.c='';}
    else if(validCode(code,t))row.c=code;
    out.push(row);
  });
  return out;
}
function doPaste(){
  const raw=document.getElementById('paste').value;
  const rows=parsePaste(raw);
  if(!rows.length){flash('Chưa đọc được dòng nào. Mỗi dòng cần đủ: ngày | nguồn | chi/thu | số tiền | nội dung | nhóm | số dư | mã đối tác','err');return;}
  const seen=new Set(DB.txns.map(fid)), have=new Set();
  pending=[];
  rows.forEach(t=>{
    t.w=walletOf(t); t.q=isQR(t);
    if(t.t!=='mv'&&!t.c){
      if(t.p&&DB.rules['p:'+t.p]) t.c=DB.rules['p:'+t.p];
      else if(!t.q){
        const k=merchantKey(t.n0||t.n);
        t.c=DB.rules['k:'+k]||guessCode(t)||'';
      }
      t.c=refineByTime(t.c,t.tm);
      if(t.c&&groupOf(t.c).k!==t.t)t.c='';
    }
    const f=fid(t); if(have.has(f))return; have.add(f);
    t.dup=seen.has(f); t.keep=!t.dup;
    if(t.dup)t.warn='Đã có trong sổ, bỏ chọn sẵn';
    else if(t.s==='vi'&&t.t==='chi'){
      const near=DB.txns.find(x=>x.t==='chi'&&x.w&&x.a===t.a&&
        Math.abs((new Date(x.d)-new Date(t.d))/864e5)<=2);
      if(near)t.warn='Có thể trùng: đã ghi một khoản '+money(t.a)+'₫ qua ví từ BIDV ngày '+near.d.slice(8,10)+'/'+near.d.slice(5,7);
    }
    pending.push(t);
  });
  pending.sort((a,b)=>(b.d+' '+(b.tm||'')).localeCompare(a.d+' '+(a.tm||'')));
  msg=''; render();
}

function commit(){
  const add=pending.filter(t=>t.keep).map(t=>{
    const o={id:Date.now()+Math.random(),d:t.d,a:t.a,t:t.t,n:t.n,s:t.s||'bidv'};
    if(t.t==='mv')o.s2=t.s2||'vi'; else o.c=t.c;
    if(t.tm)o.tm=t.tm; if(t.b)o.b=t.b; if(t.p)o.p=t.p;
    if(t.w)o.w=t.w; if(t.q)o.q=1; if(t.n0&&t.n0!==t.n)o.n0=t.n0;
    return o;});
  DB.txns=DB.txns.concat(add);
  add.forEach(t=>{

    if((g==='divay'&&t.t==='thu')||(g==='muon'&&t.t==='chi')){

}

function byGroup(list){
  const m={}; list.filter(t=>t.t==='chi').forEach(t=>{const g=groupOf(t.c).id;m[g]=(m[g]||0)+t.a;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function bySub(list,gid){
  const m={}; list.filter(t=>t.t==='chi'&&groupOf(t.c).id===gid).forEach(t=>{m[t.c]=(m[t.c]||0)+t.a;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

/* Ô lớn nhất chiếm cột trái, phần còn lại xếp chồng bên phải.
   Ô nào mỏng dưới 22px thì gộp dần vào "Khác" để lúc nào cũng đọc được chữ. */
function layoutBlocks(items,W,H){
  if(!items.length)return [];
  if(items.length===1)return [Object.assign({},items[0],{x:0,y:0,w:W,h:H})];
  let list=items.slice().sort((a,b)=>b.v-a.v);
  const MINH=22;
  while(list.length>2){
    const total=list.reduce((s,i)=>s+i.v,0), rest=total-list[0].v;
    if(!rest)break;
    if(list[list.length-1].v/rest*H>=MINH)break;
    const a=list.pop(), b=list.pop();
    list.push({id:'__o',name:'Khác',v:a.v+b.v,col:'#8FA0A7',sub:false});
    list.sort((x,y)=>y.v-x.v);
  }
  /* ô "Khác" luôn xuống cuối cho dễ đọc */
  const oi=list.findIndex(x=>x.id==='__o');
  if(oi>0)list.push(list.splice(oi,1)[0]);
  const total=list.reduce((s,i)=>s+i.v,0), share=list[0].v/total, rest=total-list[0].v;
  const out=[];

  if(share>0.66){
    /* một nhóm áp đảo: cắt ngang. Phần còn lại quá nhỏ nên gộp thành một ô,
       nếu chia tiếp thì ô nào cũng mỏng không đọc nổi. */
    let tail=list.slice(1);
    if(tail.length>1){
      const v=tail.reduce((s,x)=>s+x.v,0);
      tail=[{id:'__o',name:'Khác',v,col:'#8FA0A7',sub:false}];
    }
    const h0=Math.min(Math.round(Math.min(0.88,share)*H), H-tail.length*MINH);
    out.push(Object.assign({},list[0],{x:0,y:0,w:W,h:h0}));
    out.push(Object.assign({},tail[0],{x:0,y:h0,w:W,h:H-h0}));
    return out;
  }
  let w0=Math.round(Math.max(0.22,share)*W);
  out.push(Object.assign({},list[0],{x:0,y:0,w:w0,h:H}));
  const tail=list.slice(1); let y=0;
  tail.forEach((it,i)=>{
    const hh=i===tail.length-1?H-y:Math.round(it.v/rest*H);
    out.push(Object.assign({},it,{x:w0,y,w:W-w0,h:hh})); y+=hh;
  });
  return out;
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*(1-k)+255*k), g=Math.round(((n>>8)&255)*(1-k)+255*k), b=Math.round((n&255)*(1-k)+255*k);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function treemap(list,chi){
  const W=350,H=178,G=3;
  let items,back='';
  if(open.zoom){
    const g=groupOf(open.zoom), subs=bySub(list,open.zoom);
    const tot=subs.reduce((s,x)=>s+x[1],0);
    items=subs.map(([code,v],i)=>({id:code,name:code===open.zoom?'chưa phân chi tiết':labelOf(code),
      v,pc:Math.round(v/tot*100),col:shade(g.c,i*0.17),amt:v}));
    back=`<div class="stack-note" style="margin-bottom:8px"><span><button style="background:none;border:0;padding:0;color:var(--jade);font-weight:600;font-size:12.5px" onclick="zoomOut()">‹ tất cả nhóm</button> · ${esc(g.n)}</span></div>`;
  }else{
    const gs=byGroup(list); let big=[],小=0;
    gs.forEach(([id,v])=>{ if(v/chi>=0.03)big.push({id,name:groupOf(id).sn||groupOf(id).n,v,col:groupOf(id).c,amt:v,
      pc:Math.round(v/chi*100),sub:groupOf(id).subs.length>0}); else 小+=v; });
    if(小>0)big.push({id:'__o',name:'Khác',v:小,col:'#8FA0A7',amt:小,pc:Math.max(1,Math.round(小/chi*100)),sub:false});
    items=big;
  }
  if(!items.length)return '';
  const boxes=layoutBlocks(items,W,H);
  const tt=boxes.reduce((a,b)=>a+b.v,0);
  let sv='';
  boxes.forEach(b=>{
    b.pc=Math.max(1,Math.round(b.v/tt*100)); b.amt=b.v;
    const w=Math.max(0,b.w-G), h=Math.max(0,b.h-G);
    sv+=`<g${b.sub||open.zoom?'':''} style="cursor:pointer" onclick="${b.sub&&!open.zoom?`zoomIn('${b.id}')`:'0'}">
      <rect x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${b.col}"></rect>`;
    if(w>=64&&h>=52){
      sv+=`<text x="${(b.x+11).toFixed(1)}" y="${(b.y+24).toFixed(1)}" font-size="13" fill="#fff">${esc(b.name)}</text>
        <text x="${(b.x+11).toFixed(1)}" y="${(b.y+45).toFixed(1)}" font-size="18" font-weight="600" fill="#fff">${b.pc}%</text>`;
      if(h>=70)sv+=`<text x="${(b.x+11).toFixed(1)}" y="${(b.y+63).toFixed(1)}" font-size="11.5" fill="#ffffffcc">${money(b.amt)}</text>`;
    }else if(w>=56&&h>=32){
      sv+=`<text x="${(b.x+9).toFixed(1)}" y="${(b.y+17).toFixed(1)}" font-size="11" fill="#fff">${esc(b.name)}</text>
        <text x="${(b.x+9).toFixed(1)}" y="${(b.y+32).toFixed(1)}" font-size="13" font-weight="600" fill="#fff">${b.pc}%</text>`;
    }else if(w>=46&&h>=18){
      sv+=`<text x="${(b.x+7).toFixed(1)}" y="${(b.y+14).toFixed(1)}" font-size="11" fill="#fff">${esc(b.name)} ${b.pc}%</text>`;
    }
    sv+=`</g>`;
  });
  return back+`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img">
    <title>Cơ cấu chi tiêu, diện tích tỷ lệ với số tiền</title>${sv}</svg>`;
}

function catSelect(val,kind,handler){
  const gs=GROUPS.filter(g=>g.k===kind);
  let o=`<option value="" ${val?'':'selected'}>— chọn nhóm —</option>`;
  gs.forEach(g=>{
    if(!g.subs.length) o+=`<option value="${g.id}" ${val===g.id?'selected':''}>${g.n}</option>`;
    else o+=`<optgroup label="${g.n}">`
      +g.subs.map(([id,n])=>`<option value="${id}" ${val===id?'selected':''}>${n}</option>`).join('')
      +`<option value="${g.id}" ${val===g.id?'selected':''}>chưa rõ chi tiết</option></optgroup>`;
  });
  return `<select class="pill ${val?'':'need'}" onchange="${handler}">${o}</select>`;
}

    const v=bal[s.id]||0;
    let note;
    if(s.id==='bidv'&&chk) note=chk.diff===0
      ? `<span class="khop">khớp ngân hàng lúc ${chk.at.d.slice(8,10)}/${chk.at.d.slice(5,7)}${chk.at.tm?' '+chk.at.tm:''}</span>`
      : `<span class="lech">lệch ${short(Math.abs(chk.diff))}₫ so với ngân hàng</span>`;
    else{const c=DB.checks&&DB.checks[s.id];
      note=c?'đã đối chiếu '+(Math.floor((Date.now()-c)/864e5)||'hôm nay'===''?'':Math.floor((Date.now()-c)/864e5))+' ngày trước':'chưa đối chiếu lần nào';
      if(c&&Math.floor((Date.now()-c)/864e5)===0)note='đã đối chiếu hôm nay';}
    h+=`<div class="src"><div><div class="src-n">${s.n}</div><div class="src-m">${note}</div></div>
      <div><div class="src-a ${v<0?'neg':''}">${money(v)} ₫</div>
      <button class="chk-btn" onclick="reconcile('${s.id}')">đối chiếu</button></div></div>`;
  });
  h+=`</div>`;

  const dt=debtTotals();
  if(DB.debts.length){
    const nNo=DB.debts.filter(d=>d.kind!=='cho').length, nCho=DB.debts.filter(d=>d.kind==='cho').length;
    h+=`<h2>Nợ nần</h2><div class="panel">`;
    if(dt.no&&nNo>1)h+=`<div class="src"><div><div class="src-n">Vy đang nợ</div><div class="src-m">tổng ${nNo} khoản</div></div><div class="src-a neg">${money(dt.no)} ₫</div></div>`;
    if(dt.cho&&nCho>1)h+=`<div class="src"><div><div class="src-n">Người khác nợ Vy</div><div class="src-m">tổng ${nCho} khoản</div></div><div class="src-a">${money(dt.cho)} ₫</div></div>`;
    DB.debts.forEach(d=>{
      const i=debtInfo(d);
      const note=i.done?'đã xong'
        :i.nextDate?(d.mode==='gop'?`kỳ ${i.kyDone+1}/${d.periods} · `:'')+'hạn '+i.nextDate.slice(8,10)+'/'+i.nextDate.slice(5,7)
          +(i.days!==null&&i.days<=7?` · còn ${i.days} ngày`:'')
        :'chưa đặt hạn';
      h+=`<div class="src"><div><div class="src-n">${esc(d.name)}</div>
        <div class="src-m ${i.days!==null&&i.days<=7&&!i.done?'lech':''}">${d.kind==='cho'?'Vy cho mượn · ':'Vy đang nợ · '}${note}</div></div>
        <div class="src-a ${d.kind==='cho'?'':'neg'}">${money(i.left)} ₫</div></div>`;
    });
    h+=`</div><div class="sp"></div><button class="btn ghost" onclick="go('debt')">Mở sổ nợ</button>`;
  }

  const gaps=chainGaps().filter(g=>g.d.slice(0,7)===ym(cursor));
  if(gaps.length) h+=`<div class="sp"></div><div class="err"><b>Chuỗi số dư BIDV bị đứt</b><br>`
    +gaps.slice(0,3).map(g=>`Trước giao dịch ${g.d.slice(8,10)}/${g.d.slice(5,7)}${g.tm?' '+g.tm:''} còn thiếu một khoản ${g.gap<0?'chi':'thu'} khoảng ${money(Math.abs(g.gap))}₫.`).join('<br>')+`</div>`;

  if(groups.length){
    const prevL=monthTx(new Date(cursor.getFullYear(),cursor.getMonth()-1,1));
    const pMap=Object.fromEntries(byGroup(prevL));
    const mxV=Math.max(groups[0][1],...groups.map(([id])=>pMap[id]||0));
    h+=`<h2>Nhóm chi, so với tháng trước</h2><div class="panel">`;
    groups.forEach(([id,v])=>{
      const g=groupOf(id), b=DB.budgets[id]||0, ov=b&&v>b;
      const pv=pMap[id]||0, dd=pv?(v-pv)/pv*100:null;
      const col=dd===null?'var(--ink-3)':Math.abs(dd)<10?'var(--ink-3)':dd>0?'var(--amber)':'var(--jade)';
      const subs=bySub(list,id), can=g.subs.length&&subs.length;
      h+=`<button class="cat" onclick="${can?`toggle('${id}')`:`go('list')`}">
        <span class="spine" style="background:${g.c}"></span><span class="cat-body">
        <span class="cat-top"><span class="cat-name">${esc(g.n)}${can?`<span class="caret">${open[id]?'▲':'▼'}</span>`:''}</span>
          <span class="cat-amt">${money(v)} <span style="font-size:12px;font-weight:500;color:${col}">${dd===null?'mới':(dd>0?'+':'')+Math.round(dd)+'%'}</span></span></span>
        <span class="track" style="height:7px"><i style="width:${v/mxV*100}%;background:${g.c}"></i>
          ${pv?`<u style="left:${Math.min(100,pv/mxV*100)}%"></u>`:''}</span>
        <span class="cat-meta"><span>${Math.round(v/chi*100)}% tổng chi${b?' · hạn mức '+short(b)+'₫':''}</span>
          <span class="${ov?'over':''}">${b?(ov?'vượt '+short(v-b)+'₫':'còn '+short(b-v)+'₫'):''}</span></span>
        </span></button>`;
      if(can&&open[id]) subs.forEach(([code,sv])=>{
        h+=`<div class="sub"><span>${esc(code===id?'chưa phân chi tiết':labelOf(code))}</span>
          <span><b>${money(sv)}</b><em>${Math.round(sv/v*100)}%</em></span></div>`;});
    });
    h+=`</div><div class="sp"></div><div class="stack-note"><span><span class="tick-legend"></span> vạch dọc là mức tháng trước</span></div>`;

    const dayTot=Array(nd).fill(0);
    list.filter(t=>t.t==='chi').forEach(t=>{const i=+t.d.slice(8,10)-1;if(i>=0&&i<nd)dayTot[i]+=t.a});
    const mx=Math.max(...dayTot,1), mxDay=dayTot.indexOf(mx)+1;
    h+=`<h2>Chi từng ngày trong tháng</h2><div class="days">`+dayTot.map((v,i)=>
      `<i class="${cur&&i===now.getDate()-1?'today':''}" style="height:${v/mx*100}%" title="Ngày ${i+1}: ${money(v)}₫"></i>`).join('')
      +`</div><div class="days-x"><span>ngày 1</span><span>${Math.ceil(nd/2)}</span><span>${nd}</span></div>
      <div class="sp"></div><div class="stack-note"><span>Mỗi cột là một ngày, cột càng cao càng tiêu nhiều${cur?', cột cam là hôm nay':''}.</span></div>
      <div class="stack-note" style="margin-top:4px"><span>Tiêu nhiều nhất là ngày ${mxDay}, hết ${money(mx)}₫.</span></div>`;
  }

  const ds=daysSinceBackup();
  if(DB.txns.length>=10&&(ds===null||ds>30))
    h+=`<div class="sp"></div><div class="stack-note"><span>${ds===null?'Sổ chưa từng được sao lưu.':'Đã '+ds+' ngày chưa sao lưu.'}
      <button style="background:none;border:0;padding:0;color:var(--jade);font-weight:600;font-size:12.5px;text-decoration:underline" onclick="go('set')">Sao lưu</button></span></div>`;
  if(msg)h+=`<div class="${msgType==='ok'?'ok':'err'}">${esc(msg)}</div>`;
  return h;
}

let _mt='chi';

function vList(){
  const list=monthTx(cursor).slice().sort((a,b)=>(b.d+' '+(b.tm||'')).localeCompare(a.d+' '+(a.tm||'')));
  if(!list.length)return `<div class="empty"><b>Chưa có giao dịch</b>${MONTH(cursor.getMonth())}/${cursor.getFullYear()} đang trống.</div>`;
  let h=`<h2>${list.length} giao dịch</h2><div class="panel">`,last='';
  const DOW=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
  list.forEach(t=>{
    if(t.d!==last){last=t.d;const dd=new Date(t.d+'T00:00');
      h+=`<div class="daygroup">${DOW[dd.getDay()]}, ${dd.getDate()}/${dd.getMonth()+1} — ${money(sumChi(list.filter(x=>x.d===t.d)))}₫</div>`;}
    const g=groupOf(t.c), col=t.t==='thu'?'var(--jade)':(t.t==='mv'||t.t==='dc')?'#C3CCC4':g.c;
    const meta=[t.tm, t.t==='mv'?srcOf(t.s).n+' → '+srcOf(t.s2).n:t.t==='dc'?'điều chỉnh · '+srcOf(t.s).n:esc(labelOf(t.c))+' · '+srcOf(t.s).n,
      t.w?'qua ví '+esc(t.w):''].filter(Boolean).join(' · ');
    h+=`<div class="tx"><span class="spine" style="background:${col}"></span>
      <div class="tx-body"><div class="tx-n">${esc(t.n)}</div><div class="tx-m">${meta}</div>
      ${(t.t==='chi'||t.t==='thu')?catSelect(t.c,t.t,"reCat('"+t.id+"',this.value)"):''}</div>
      <div style="text-align:right"><div class="tx-a ${t.t==='thu'?'in':(t.t==='mv'||t.t==='dc')?'mv':''}">${t.t==='thu'?'+':t.t==='dc'?(t.dir==='-'?'−':'+'):t.t==='mv'?'':'−'}${money(t.a)}</div>
      <button style="background:none;border:0;color:var(--ink-3);font-size:12px;padding:6px 0 0" onclick="del('${t.id}')">Xóa</button></div></div>`;
  });
  return h+`</div>`;
}

function vTrend(){
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(cursor.getFullYear(),cursor.getMonth()-i,1);
    months.push({d,tot:sumChi(monthTx(d))});}
  if(!months.some(m=>m.tot))return `<div class="empty"><b>Chưa đủ dữ liệu</b>Sau vài tháng ghi chép, xu hướng sẽ hiện ở đây.</div>`;
  const mx=Math.max(...months.map(m=>m.tot),1), cur=months[5].tot, prev=months[4].tot;
  const diff=prev?(cur-prev)/prev*100:null;
  let h=`<div class="hero"><div class="lead">Sáu tháng gần nhất</div>
    <div class="sum">${short(months.reduce((s,m)=>s+m.tot,0))}<small>₫</small></div>
    <div class="sub">${diff===null?'chưa có tháng trước để so':`tháng này ${diff>=0?'nhiều hơn':'ít hơn'} tháng trước <b>${Math.abs(Math.round(diff))}%</b>`}</div></div>
    <div class="sp"></div><div class="bars">`;
  months.forEach((m,i)=>{h+=`<div class="bcol"><em>${m.tot?short(m.tot):''}</em>
    <i class="${i===5?'cur':''}" style="height:${m.tot/mx*100}%"></i><span>${m.d.getMonth()+1}</span></div>`;});
  h+=`</div>`;
  const nowL=monthTx(months[5].d), prevL=monthTx(months[4].d);
  const a=byGroup(nowL), bMap=Object.fromEntries(byGroup(prevL));
  if(a.length){
    h+=`<h2>So với tháng trước</h2><div class="panel">`;
    a.forEach(([id,v])=>{
      const g=groupOf(id), p=bMap[id]||0, dd=p?(v-p)/p*100:null;
      const subs=bySub(nowL,id), can=g.subs.length&&subs.length;
      h+=`<button class="cat" onclick="${can?`toggle('t_${id}')`:'0'}">
        <span class="spine" style="background:${g.c}"></span><span class="cat-body">
        <span class="cat-top"><span class="cat-name">${esc(g.n)}${can?`<span class="caret">${open['t_'+id]?'▲':'▼'}</span>`:''}</span><span class="cat-amt">${money(v)}</span></span>
        <span class="cat-meta"><span>tháng trước ${p?money(p):'—'}</span>
        <span style="color:${dd===null?'var(--ink-3)':dd>0?'var(--amber)':'var(--jade)'};font-weight:500">${dd===null?'mới':(dd>0?'+':'')+Math.round(dd)+'%'}</span>
        </span></span></button>`;
      if(can&&open['t_'+id]){
        const pm=Object.fromEntries(bySub(prevL,id));
        subs.forEach(([code,sv])=>{const pv=pm[code]||0, sd=pv?(sv-pv)/pv*100:null;
          h+=`<div class="sub"><span>${esc(code===id?'chưa phân chi tiết':labelOf(code))}</span>
            <span><b>${money(sv)}</b><em style="color:${sd===null?'var(--ink-3)':sd>0?'var(--amber)':'var(--jade)'}">${sd===null?'mới':(sd>0?'+':'')+Math.round(sd)+'%'}</em></span></div>`;});
      }
    });
    h+=`</div>`;
  }
  return h;
}

  h+=`<h2>Câu lệnh cho AI</h2>
    <details><summary style="font-size:13px;color:var(--ink-3);padding:4px 0">Xem lại câu lệnh đặt trong project</summary>
      <div class="sp"></div><textarea class="mono" rows="5" readonly onclick="this.select()">${esc(promptText())}</textarea>
      <div class="sp"></div><button class="btn ghost" onclick="copyPrompt()">Chép câu lệnh</button></details>`;

    <span style="font-size:12.5px;color:var(--ink-3)">Phiên bản ${VERSION} · lưu tại ${window.storage?'kho của Claude':'trình duyệt máy này'}</span></div>
    <div class="sp"></div><button class="btn danger" onclick="wipe()">Xóa toàn bộ dữ liệu</button>`;
  return h;
}

function zoomOut(){open.zoom=null;render()}
/* ---- khoản nợ ---- */
function newDebt(kind,name,amount){
  const k=kind||(confirm('Đây là khoản Vy đi vay?\nOK = tôi đi vay · Hủy = tôi cho người khác mượn')?'no':'cho');
  const nm=name||prompt('Tên khoản nợ (tên người hoặc tên món):','');
  if(!nm)return null;
  const a=amount||parseAmt(prompt('Số tiền gốc:','')||'');
  if(!a||isNaN(a))return null;
  const gop=k==='no'&&confirm('Đây là khoản trả góp hàng tháng?\nOK = trả góp · Hủy = trả một lần');
  const d={id:'d'+Date.now(),name:nm.slice(0,40),kind:k,mode:gop?'gop':'canhan',
    principal:a,start:iso(new Date())};
  if(gop){
    d.periods=parseInt(prompt('Trả trong bao nhiêu kỳ (tháng)?','12'),10)||12;
    d.per=parseAmt(prompt('Mỗi kỳ trả bao nhiêu?','')||'')||Math.round(a/d.periods);
    const day=parseInt(prompt('Ngày trả hàng tháng (1-28):','15'),10)||15;
    d.start=iso(new Date()).slice(0,8)+String(Math.min(28,Math.max(1,day))).padStart(2,'0');
  }else{
    const du=prompt('Ngày dự kiến trả (YYYY-MM-DD), để trống nếu chưa biết:','');
    if(du&&/^\d{4}-\d{2}-\d{2}$/.test(du.trim()))d.due=du.trim();
  }
  DB.debts.push(d);save();render();return d;
}
function editDebt(id){
  const d=DB.debts.find(x=>x.id===id);if(!d)return;
  const nm=prompt('Tên khoản nợ:',d.name); if(nm)d.name=nm.slice(0,40);
  if(d.mode==='gop'){
    const p=parseInt(prompt('Số kỳ:',d.periods),10); if(p)d.periods=p;
    const per=parseAmt(prompt('Mỗi kỳ trả bao nhiêu:',money(d.per))||''); if(per)d.per=per;
    const g=parseAmt(prompt('Số tiền gốc:',money(d.principal))||''); if(g)d.principal=g;
    const day=parseInt(prompt('Ngày trả hàng tháng (1-28):',d.start.slice(8,10)),10);
    if(day)d.start=d.start.slice(0,8)+String(Math.min(28,Math.max(1,day))).padStart(2,'0');
  }else{
    const g=parseAmt(prompt('Số tiền gốc:',money(d.principal))||''); if(g)d.principal=g;
    const du=prompt('Ngày dự kiến trả (YYYY-MM-DD):',d.due||'');
    if(du&&/^\d{4}-\d{2}-\d{2}$/.test(du.trim()))d.due=du.trim(); else if(du==='')delete d.due;
  }
  save();flash('Đã cập nhật.','ok');
}
function delDebt(id){
  const d=DB.debts.find(x=>x.id===id);if(!d)return;
  if(!confirm('Xóa khoản "'+d.name+'"? Các giao dịch đã ghi vẫn giữ nguyên.'))return;
  DB.txns.forEach(t=>{if(t.debt===id)delete t.debt;});
  DB.debts=DB.debts.filter(x=>x.id!==id);save();render();
}
function payDebt(id){
  const d=DB.debts.find(x=>x.id===id);if(!d)return;
  const i=debtInfo(d);
  const a=parseAmt(prompt((d.kind==='cho'?'Thu về':'Trả')+' bao nhiêu?',money(i.nextAmt||i.left))||'');
  if(!a||isNaN(a)){flash('Số tiền chưa hợp lệ.','err');return;}
  const sc=(prompt('Từ nguồn nào? gõ 1 BIDV, 2 Ví, 3 Tiền mặt','1')||'1').trim();
  const s=sc==='2'?'vi':sc==='3'?'tm':'bidv';
  DB.txns.push({id:Date.now()+Math.random(),d:iso(new Date()),a,
    t:d.kind==='cho'?'thu':'chi', c:d.kind==='cho'?'thuno':(d.mode==='gop'?'trano_gop':'trano_cn'),
    s, n:(d.kind==='cho'?'Thu về từ ':'Trả nợ ')+d.name, debt:d.id});
  save();flash('Đã ghi '+money(a)+' ₫.','ok');
}
function tog(i){pending[i].keep=!pending[i].keep;render()}
function askSpend(i){const t=pending[i];t.t='chi';t.s='bidv';delete t.s2;t.decided=1;t.spend=true;t.c='';render()}
function askKeep(i){const t=pending[i];t.decided=1;render()}
function setName(i,v){const t=pending[i],s=String(v).trim().slice(0,60);
  if(s){t.n=s;t.named=true;}else{t.n=t.n0||t.n;t.named=false;}}
function learn(t,code){
  if(!code)return;
  if(t.p)DB.rules['p:'+t.p]=code;
  else if(!t.q&&!t.w)DB.rules['k:'+merchantKey(t.n0||t.n)]=code;
}
function setCat(i,v){const t=pending[i];t.c=v;learn(t,v);save();render()}
function reCat(id,v){const t=DB.txns.find(x=>String(x.id)===id);if(!t)return;t.c=v;learn(t,v);save();render()}
function del(id){DB.txns=DB.txns.filter(x=>String(x.id)!==id);save();render()}
function delRule(k){delete DB.rules[k];save();render()}
function setB(id,v){const n=parseAmt(v);if(!String(v).trim())delete DB.budgets[id];else if(!isNaN(n))DB.budgets[id]=n;save()}
function setOpen(id,v){const n=parseAmt(v);DB.opens[id]=(!String(v).trim()||isNaN(n))?0:n;save();render()}
function setAB(v){DB.opts=Object.assign({},DB.opts,{ab:v});save();render()}
function addManual(){
  const type=document.getElementById('mt').value;
  const a=parseAmt(document.getElementById('ma').value), n=document.getElementById('mn').value.trim();
  if(!a||isNaN(a)){flash('Số tiền chưa hợp lệ.','err');return;}
  const o={id:Date.now()+Math.random(),d:document.getElementById('md').value||iso(new Date()),
    a,t:type,n:n||(type==='mv'?'Chuyển tiền':'Giao dịch'),s:document.getElementById('msrc').value};
  if(type==='mv'){o.s2=document.getElementById('ms2').value;
    if(o.s2===o.s){flash('Hai nguồn phải khác nhau.','err');return;}}
  else{const sel=document.querySelector('#app select.pill');o.c=sel?sel.value:'';
    if(!o.c){flash('Chưa chọn nhóm.','err');return;}}
  DB.txns.push(o);save();msg='';cursor=new Date();go('home');autoBackup();
}
function applyBackup(d){
  if(!d||!Array.isArray(d.txns))throw 0;
  if((d.v||1)<4)d=migrate(d);
  DB=Object.assign({},d,{txns:d.txns,debts:Array.isArray(d.debts)?d.debts:[],budgets:d.budgets||{},rules:d.rules||{},
    opens:Object.assign({bidv:0,vi:0,tm:0},d.opens||{}),checks:d.checks||{},
    opts:Object.assign({ab:'off'},d.opts||{}),lastBackup:d.lastBackup||0,v:4});
  save();flash('Đã khôi phục '+d.txns.length+' giao dịch.','ok');
}
function restoreFile(el){const f=el.files&&el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{applyBackup(JSON.parse(r.result));}catch(e){flash('File sao lưu không đọc được.','err');}};
  r.onerror=()=>flash('Không mở được file.','err'); r.readAsText(f);}
function doRestore(){try{applyBackup(JSON.parse(document.getElementById('restore').value));}
  catch(e){flash('Bản sao lưu không đọc được.','err');}}
function wipe(){if(confirm('Xóa hết giao dịch, hạn mức và quy tắc? Không khôi phục được.')){
  DB={txns:[],debts:[],budgets:{},rules:{},opens:DB.opens,checks:{},opts:DB.opts,lastBackup:0,v:4};save();msg='';go('home');}}
function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);toTop=true;render()}

/* ==================== vẽ ==================== */
const TABS=[['home','Tổng quan','◉'],['add','Nhập','＋'],['list','Giao dịch','☰'],['debt','Nợ','◈'],['trend','Xu hướng','◪']];
let toTop=true;
function render(){
  const y=window.scrollY||window.pageYOffset||0;
  const showMonth=tab==='home'||tab==='list';
  let h=`<div class="top">`;
  h+= showMonth
    ? `<div class="month"><button class="arrow" onclick="move(-1)" aria-label="Tháng trước">‹</button>
       <h1>${MONTH(cursor.getMonth())}, ${cursor.getFullYear()}</h1>
       <button class="arrow" onclick="move(1)" ${ym(cursor)>=ym(new Date())?'disabled':''} aria-label="Tháng sau">›</button></div>`
    : `<h1 style="font-size:17px;font-weight:600;margin:0">${tab==='add'?'Nhập chi tiêu':tab==='trend'?'Xu hướng':tab==='debt'?'Sổ nợ':'Cài đặt'}</h1>`;
  h+=`<button class="gear" onclick="go('${tab==='set'?'home':'set'}')" aria-label="Cài đặt">${tab==='set'?'✕':'⚙'}</button></div>`;
  h+=`<div class="view">`+(tab==='home'?vHome():tab==='add'?vImport():tab==='list'?vList():
      tab==='debt'?vDebt():tab==='trend'?vTrend():vSet())+`</div>`;
  document.getElementById('app').innerHTML=h;
  document.getElementById('nav').innerHTML=TABS.map(([k,n,i])=>
    `<button class="${tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${n}</button>`).join('');
  window.scrollTo(0, toTop?0:y);
  toTop=false;
}
